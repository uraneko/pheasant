[package]
name = "pheasant"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
	"crates/pheasant_core",
	"crates/pheasant_uri",
	# "crates/pheasant_macro_utils",
	# "macros/pheasant_macro_get",
	# "macros/pheasant_macro_post",
	# "macros/pheasant_macro_fail",
	"crates/pheasant_headers",
	"crates/pheasant_message",
	"crates/pheasant_server",
	"macros/byte_enum",
]
resolver = "3"

[[example]]
name = "e1"
path = "src/basic.rs"

[workspace.dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
proc-macro2 = "1.0.95"
syn = { version = "2.0.104", features = [
	"extra-traits",
	"full",
	"parsing",
	"printing",
] }
quote = "1.0.40"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
crossbeam-channel = "0.5.15"
tokio = { version = "1.46.1", features = ["full"] }
deflate = { version = "1.0.0", features = ["gzip"] }
mime = "0.3.17"
rustls = { version = "0.23.31", features = ["ring"] }
rustls-pki-types = "1.12.0"
rcgen = "0.14.3"
url = "2.5.4"
hashbrown = "0.16.0"

pheasant_core = { version = "0.1.0", path = "crates/pheasant_core" }
pheasant_uri = { version = "0.1.0", path = "crates/pheasant_uri" }
pheasant_headers = { version = "0.1.0", path = "crates/pheasant_headers" }
pheasant_message = { version = "0.1.0", path = "crates/pheasant_message" }
pheasant_server = { version = "0.1.0", path = "crates/pheasant_server" }
# pheasant_macro_utils = { version = "0.1.0", path = "crates/pheasant_macro_utils" }
# pheasant_macro_get = { version = "0.1.0", path = "macros/pheasant_macro_get" }
# pheasant_macro_post = { version = "0.1.0", path = "macros/pheasant_macro_post" }
# pheasant_macro_fail = { version = "0.1.0", path = "macros/pheasant_macro_fail" }

[dependencies]
pheasant_core = { workspace = true }
pheasant_uri = { workspace = true }
pheasant_server = { workspace = true }
pheasant_message = { workspace = true }
pheasant_headers = { workspace = true }
# pheasant_macro_utils = { workspace = true }
# pheasant_macro_get = { workspace = true }
# pheasant_macro_post = { workspace = true }
# pheasant_macro_fail = { workspace = true }
crossbeam-utils = "0.8.21"
uuid = "1.18.1"
rayon = "1.11.0"
hashbrown = { workspace = true, features = ["serde"] }
chrono.workspace = true
embedded-io = "0.6.1"
