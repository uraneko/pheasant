[package]
name = "pheasant"
version = "0.1.0"
edition = "2024"

[[example]]
path = "examples/basic"
name = "basic"

[workspace]
members = [
	"crates/pheasant_http",
	"crates/pheasant_uri",
	"crates/pheasant_services",
]
resolver = "3"
exclude = ["examples/basic"]
